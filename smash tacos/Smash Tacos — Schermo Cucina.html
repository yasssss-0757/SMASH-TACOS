<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smash Tacos — Schermo Cucina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="kitchen">
<canvas id="bg"></canvas>
<div class="scrim"></div>
<div class="content">
  <header>
    <div>
      <h1>Smash Tacos — Cucina</h1>
      <div class="sub">Ordini in arrivo dal sito, in tempo reale</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="cols">
    <div class="col">
      <h2>In preparazione <span class="n" id="prepCount">0</span></h2>
      <div class="queue" id="prepQueue"></div>
    </div>
    <div class="col">
      <h2>Pronti per il ritiro <span class="n" id="readyCount">0</span></h2>
      <div class="queue" id="readyQueue"></div>
    </div>
  </div>
</div>

<script src="assets/js/cucina.js"></script>
</body>
</html>
