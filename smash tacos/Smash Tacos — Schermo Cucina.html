<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smash Tacos — Schermo Cucina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --char:#0f0a07; --char2:#150e0a;
  --chili:#d94f2b; --ember:#ff8a3d;
  --lime:#c4d94a;
  --tortilla:#f6ecd9;
  --line: rgba(246,236,217,.14);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--char); color:var(--tortilla);
  font-family:'Work Sans',sans-serif; overflow-x:hidden;
}
h1,h2,.display{font-family:'Archivo Black',sans-serif; font-weight:400; letter-spacing:-.01em;}
#bg{position:fixed; inset:0; z-index:0; display:block;}
.scrim{position:fixed; inset:0; z-index:1; background:radial-gradient(1200px 600px at 50% 0%, rgba(15,10,7,.2), rgba(15,10,7,.85) 70%);}
.content{position:relative; z-index:2; padding:28px 28px 60px; padding-top:calc(28px + env(safe-area-inset-top,0px));}
header{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
header h1{font-size:clamp(24px,3.2vw,34px); margin:0; color:var(--tortilla);}
header .sub{opacity:.6; font-size:13px; margin-top:4px;}
.clock{font-family:'Archivo Black'; font-size:22px; color:var(--ember);}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.col h2{font-size:15px; text-transform:none; letter-spacing:.02em; opacity:.75; margin:0 0 14px; font-family:'Work Sans'; font-weight:700;}
.col h2 .n{color:var(--chili); font-family:'Archivo Black'; font-size:15px;}
.queue{display:flex; flex-direction:column; gap:14px;}
.order{
  border:1px solid var(--line); border-radius:16px; padding:18px 20px;
  background:rgba(21,14,10,.72); backdrop-filter:blur(3px);
  display:flex; align-items:center; gap:16px;
  animation:enter .4s cubic-bezier(.2,.8,.3,1.1);
}
@keyframes enter{from{opacity:0; transform:translateY(-10px) scale(.97);} to{opacity:1; transform:none;}}
.order .num{
  font-family:'Archivo Black'; font-size:30px; color:var(--ember); min-width:64px;
  text-align:center; border-right:1px solid var(--line); padding-right:16px;
}
.order .body{flex:1; min-width:0;}
.order .name{font-weight:700; font-size:15px; margin-bottom:4px;}
.order .items{font-size:13px; opacity:.75; line-height:1.5;}
.order .meta{display:flex; align-items:center; gap:10px; margin-top:8px;}
.order .timer{font-size:12px; opacity:.55; font-variant-numeric:tabular-nums;}
.order .timer.late{color:var(--chili); opacity:1; font-weight:700;}
.donebtn{
  background:var(--lime); color:var(--char2); border:none; border-radius:20px;
  padding:8px 16px; font-weight:700; font-size:13px; cursor:pointer; font-family:'Work Sans'; white-space:nowrap;
}
.donebtn:hover{filter:brightness(1.08);}
.ready .num{color:var(--lime);}
.empty{opacity:.4; font-size:14px; padding:20px 0; text-align:center; border:1px dashed var(--line); border-radius:16px;}
@media (max-width:800px){ .cols{grid-template-columns:1fr;} }
@media (prefers-reduced-motion: reduce){ .order{animation:none;} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="scrim"></div>
<div class="content">
  <header>
    <div>
      <h1>Smash Tacos — Cucina</h1>
      <div class="sub">Ordini in arrivo dal sito, in tempo reale</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="cols">
    <div class="col">
      <h2>In preparazione <span class="n" id="prepCount">0</span></h2>
      <div class="queue" id="prepQueue"></div>
    </div>
    <div class="col">
      <h2>Pronti per il ritiro <span class="n" id="readyCount">0</span></h2>
      <div class="queue" id="readyQueue"></div>
    </div>
  </div>
</div>

<script>
/* --- sfondo: cielo notturno con stelle che si illuminano + braci leggere --- */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function rand(a,b){ return a + Math.random()*(b-a); }

class Star{
  constructor(){ this.reset(); }
  reset(){
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.r = rand(.6, 2.2);
    this.baseAlpha = rand(.15, .55);
    this.speed = rand(.5, 1.6);
    this.phase = rand(0, Math.PI*2);
    this.warm = Math.random() > .8;
  }
  draw(t){
    const twinkle = .5 + .5*Math.sin(t*.001*this.speed + this.phase);
    const alpha = this.baseAlpha + twinkle*.45;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = this.warm
      ? `rgba(255,200,150,${alpha.toFixed(2)})`
      : `rgba(246,236,217,${alpha.toFixed(2)})`;
    ctx.shadowBlur = this.r > 1.6 ? 6 : 0;
    ctx.shadowColor = this.warm ? 'rgba(255,180,120,.8)' : 'rgba(246,236,217,.6)';
    ctx.fill();
  }
}
class Ember{
  constructor(){ this.reset(true); }
  reset(initial){
    this.x = rand(0, W);
    this.y = initial ? rand(0, H) : H + rand(0,40);
    this.r = rand(1, 2.6);
    this.speed = rand(.2, .6);
    this.drift = rand(-.3,.3);
    this.flicker = rand(0, Math.PI*2);
  }
  step(){
    this.y -= this.speed;
    this.x += Math.sin(performance.now()*.001 + this.flicker) * this.drift;
    if(this.y < -10) this.reset(false);
  }
  draw(){
    const alpha = .25 + .35*Math.abs(Math.sin(this.flicker + performance.now()*.002));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,138,61,${alpha.toFixed(2)})`;
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(255,138,61,.8)';
    ctx.fill();
  }
}
const stars = Array.from({length: reduceMotion ? 60 : 140}, ()=>new Star());
const embers = Array.from({length: reduceMotion ? 0 : 18}, ()=>new Ember());

function drawSky(){
  const g = ctx.createRadialGradient(W*0.5,H*0.05,0, W*0.5,H*0.4,Math.max(W,H)*0.9);
  g.addColorStop(0,'#1a1109');
  g.addColorStop(1,'#0a0705');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function loop(t){
  drawSky();
  stars.forEach(s=>s.draw(t));
  embers.forEach(e=>{ e.step(); e.draw(); });
  if(!reduceMotion) requestAnimationFrame(loop);
}
drawSky();
stars.forEach(s=>s.draw(0));
if(!reduceMotion) requestAnimationFrame(loop);

/* --- orologio --- */
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 15000);

/* --- coda ordini --- */
function loadOrders(){
  try{ return JSON.parse(localStorage.getItem('smashOrders')||'[]'); }catch(err){ return []; }
}
function saveOrders(orders){
  try{ localStorage.setItem('smashOrders', JSON.stringify(orders)); }catch(err){}
}
function fmtElapsed(ts){
  const s = Math.max(0, Math.floor((Date.now()-ts)/1000));
  const m = Math.floor(s/60), r = s%60;
  return `${m}:${r.toString().padStart(2,'0')}`;
}
function render(){
  const orders = loadOrders();
  const prep = orders.filter(o=>o.status!=='pronto').sort((a,b)=>a.ts-b.ts);
  const ready = orders.filter(o=>o.status==='pronto').sort((a,b)=>b.ts-a.ts);
  document.getElementById('prepCount').textContent = prep.length;
  document.getElementById('readyCount').textContent = ready.length;

  const prepEl = document.getElementById('prepQueue');
  prepEl.innerHTML = prep.length ? prep.map(o=>{
    const elapsed = Date.now()-o.ts;
    const late = elapsed > 15*60*1000;
    return `<div class="order">
      <div class="num">#${o.num}</div>
      <div class="body">
        <div class="name">${o.name}</div>
        <div class="items">${o.items.join(' · ')}</div>
        <div class="meta"><span class="timer ${late?'late':''}" data-ts="${o.ts}">${fmtElapsed(o.ts)}</span></div>
      </div>
      <button class="donebtn" onclick="markReady(${o.num})">Pronto ✓</button>
    </div>`;
  }).join('') : '<div class="empty">Nessun ordine in preparazione</div>';

  const readyEl = document.getElementById('readyQueue');
  readyEl.innerHTML = ready.length ? ready.map(o=>`
    <div class="order ready">
      <div class="num">#${o.num}</div>
      <div class="body">
        <div class="name">${o.name}</div>
        <div class="items">${o.items.join(' · ')}</div>
      </div>
      <button class="donebtn" style="background:transparent; border:1px solid var(--line); color:var(--tortilla);" onclick="markPicked(${o.num})">Ritirato</button>
    </div>`).join('') : '<div class="empty">Nessun ordine pronto</div>';
}
function markReady(num){
  const orders = loadOrders();
  const o = orders.find(x=>x.num===num);
  if(o){ o.status='pronto'; saveOrders(orders); render(); broadcast(); }
}
function markPicked(num){
  let orders = loadOrders();
  orders = orders.filter(x=>x.num!==num);
  saveOrders(orders); render(); broadcast();
}
function broadcast(){
  try{ const bc = new BroadcastChannel('smashOrders'); bc.postMessage({type:'update'}); bc.close(); }catch(err){}
}
render();
setInterval(()=>{
  document.querySelectorAll('.timer').forEach(el=>{
    const ts = parseInt(el.dataset.ts,10);
    el.textContent = fmtElapsed(ts);
    el.classList.toggle('late', (Date.now()-ts) > 15*60*1000);
  });
}, 1000);

window.addEventListener('storage', (e)=>{ if(e.key==='smashOrders') render(); });
try{
  const bc = new BroadcastChannel('smashOrders');
  bc.onmessage = ()=> render();
}catch(err){}
</script>
</body>
</html>
